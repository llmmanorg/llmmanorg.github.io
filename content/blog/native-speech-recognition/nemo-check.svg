<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Gap between llmman and NeMo per stage, as a percentage of a typical value, on a scale from 0.001 to 10 percent. Encoder F16 0.04 to 0.12 percent, Encoder Q8_0 0.38 to 3.8 percent, Decoder F16 0.008 to 0.08 percent, Decoder Q8_0 0.11 to 2.1 percent. A dashed line marks the half-precision floor of about 0.05 percent: the F16 encoder sits on it, and Q8_0 is about ten times higher" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7aa2f7"/></marker></defs>
<rect width="900" height="250" fill="#0b0e14"/>
<text x="8" y="22" font-size="10" letter-spacing="1.6" fill="#8a94a8" text-anchor="start">GAP BETWEEN LLMMAN AND NEMO, AS A PERCENTAGE OF A TYPICAL VALUE</text>
<rect x="8" y="32" width="884" height="214" rx="8" fill="#151a25" stroke="#232a3a"/>
<path d="M170 196 H860" stroke="#232a3a" stroke-width="1"/>
<path d="M170.0 54 V200" stroke="#232a3a" stroke-width="1"/>
<text x="170.0" y="214" font-size="10" fill="#8a94a8" text-anchor="middle">0.001%</text>
<path d="M342.5 54 V200" stroke="#232a3a" stroke-width="1"/>
<text x="342.5" y="214" font-size="10" fill="#8a94a8" text-anchor="middle">0.01%</text>
<path d="M515.0 54 V200" stroke="#232a3a" stroke-width="1"/>
<text x="515.0" y="214" font-size="10" fill="#8a94a8" text-anchor="middle">0.1%</text>
<path d="M687.5 54 V200" stroke="#232a3a" stroke-width="1"/>
<text x="687.5" y="214" font-size="10" fill="#8a94a8" text-anchor="middle">1%</text>
<path d="M860.0 54 V200" stroke="#232a3a" stroke-width="1"/>
<text x="860.0" y="214" font-size="10" fill="#8a94a8" text-anchor="middle">10%</text>
<text x="24" y="76" font-size="11" fill="#d7dce6" text-anchor="start">Encoder, F16</text>
<rect x="446.4" y="64" width="82.3" height="16" rx="3" fill="#7aa2f7" fill-opacity="0.85" stroke="#7aa2f7"/>
<text x="24" y="106" font-size="11" fill="#d7dce6" text-anchor="start">Encoder, Q8_0</text>
<rect x="615.0" y="94" width="172.5" height="16" rx="3" fill="#7aa2f7" fill-opacity="0.3" stroke="#7aa2f7"/>
<text x="24" y="136" font-size="11" fill="#d7dce6" text-anchor="start">Decoder, F16</text>
<rect x="322.9" y="124" width="178.1" height="16" rx="3" fill="#7aa2f7" fill-opacity="0.85" stroke="#7aa2f7"/>
<text x="24" y="166" font-size="11" fill="#d7dce6" text-anchor="start">Decoder, Q8_0</text>
<rect x="522.1" y="154" width="220.9" height="16" rx="3" fill="#7aa2f7" fill-opacity="0.3" stroke="#7aa2f7"/>
<path d="M461.6 48 V196" stroke="#f2f5fa" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="467.55882380491863" y="190" font-size="10" fill="#f2f5fa" text-anchor="start">half-precision floor, 0.05%</text>
</svg>
