<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="The speech pipeline: clip.wav goes through the WAV parser as 16 kHz samples, framing cuts 1,056 frames, the mel bands step produces a 1,056 by 128 log-mel spectrogram, the Conformer encoder shrinks it eightfold to 132 vectors of 1,024, the decoder reads them through cross-attention together with a ten-id task prompt and emits 33 token ids, and a table lookup turns them into text" width="900" height="400" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<defs><marker id="sar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7aa2f7"/></marker></defs>
<rect width="900" height="400" fill="#0b0e14"/>
<g fill="#8a94a8" font-size="10" letter-spacing="1.6"><text x="250" y="56">RUST, NO WEIGHTS</text><text x="492" y="218">GGML WITH GGUF WEIGHTS</text><text x="250" y="218">TABLE LOOKUP</text></g>
<rect x="8" y="70" width="150" height="60" rx="8" fill="none" stroke="#232a3a" stroke-dasharray="4 3"/>
<g stroke="#232a3a" fill="#151a25"><rect x="250" y="70" width="150" height="60" rx="8"/><rect x="492" y="70" width="150" height="60" rx="8"/><rect x="734" y="70" width="158" height="60" rx="8"/><rect x="250" y="230" width="150" height="60" rx="8"/><rect x="492" y="336" width="150" height="48" rx="8"/></g>
<g stroke="#7aa2f7" fill="#151a25"><rect x="734" y="230" width="158" height="60" rx="8"/><rect x="492" y="230" width="150" height="60" rx="8"/></g>
<rect x="8" y="230" width="150" height="60" rx="8" fill="#11151f" stroke="#7aa2f7"/>
<g font-size="12" fill="#d7dce6"><text x="24" y="96">clip.wav</text><text x="266" y="96">WAV parser</text><text x="508" y="96">Framing</text><text x="750" y="96">Mel bands</text><text x="750" y="256">Conformer encoder</text><text x="508" y="256">Decoder</text><text x="266" y="256">Table lookup</text><text x="24" y="256">Text</text><text x="508" y="356">Task prompt</text></g>
<g font-size="10" fill="#8a94a8"><text x="24" y="114">16-bit mono, 16 kHz</text><text x="266" y="114">checked chunks</text><text x="508" y="114">pre-emphasis, Hann</text><text x="750" y="114">Fourier, 128 bands, log</text><text x="750" y="274">8x shrink, 32 blocks</text><text x="508" y="274">8 blocks, cross-attention</text><text x="266" y="274">vocabulary pieces</text><text x="24" y="274">{"text": "..."}</text><text x="508" y="372">10 ids from the GGUF</text></g>
<g fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity=".75" marker-end="url(#sar)"><path d="M158 100 H248"/><path d="M400 100 H490"/><path d="M642 100 H732"/><path d="M813 130 V228"/><path d="M734 260 H644"/><path d="M492 260 H402"/><path d="M250 260 H160"/><path d="M567 336 V292"/></g>
<g font-size="10" fill="#7aa2f7" text-anchor="middle"><text x="204" y="92">bytes</text><text x="446" y="92">samples</text><text x="688" y="92">1,056 frames</text><text x="688" y="252">132 × 1,024</text><text x="446" y="252">33 token ids</text><text x="204" y="252">pieces</text></g>
<g font-size="10" fill="#8a94a8" text-anchor="middle"><text x="446" y="118">16 kHz</text><text x="688" y="118">× 400 samples</text><text x="688" y="278">one per 80 ms</text><text x="446" y="278">most likely</text></g>
<g font-size="10" text-anchor="end"><text x="805" y="176" fill="#7aa2f7">log-mel spectrogram</text><text x="805" y="190" fill="#8a94a8">1,056 × 128</text></g>
</svg>
